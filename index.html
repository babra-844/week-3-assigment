<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- Page Heading -->
        <section class="heading-card">
            <h1>Budget Tracker</h1>
            <p>Keep track of your expenses and manage your money with ease.</p>
        </section>

        <!-- Add Expense Form -->
        <section class="card">
            <h2>Add Expense</h2>

            <form id="expenseForm">

                <div class="form-group">
                    <label for="expenseName">Expense Name</label>
                    <input
                        type="text"
                        id="expenseName"
                        placeholder="e.g. Groceries"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="amount">Amount (KES)</label>
                    <input
                        type="number"
                        id="amount"
                        placeholder="e.g. 1500"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Select a category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Bills">Bills</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>

                <button type="submit">Add Expense</button>

            </form>
        </section>

        <!-- Expense Table -->
        <section class="card">
            <div class="table-heading">
                <div>
                    <h2>Expense Table</h2>
                    <p>View and manage your recorded expenses.</p>
                </div>

                <div class="total">
                    <span>Total</span>
                    <strong id="totalAmount">KES 0.00</strong>
                </div>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Expense</th>
                            <th>Amount</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="expenseTableBody">
                        <tr id="emptyRow">
                            <td colspan="5">No expenses added yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script>
        const form = document.getElementById("expenseForm");
        const tableBody = document.getElementById("expenseTableBody");
        const totalAmount = document.getElementById("totalAmount");

        let total = 0;

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const expenseName = document.getElementById("expenseName").value;
            const amount = parseFloat(document.getElementById("amount").value);
            const category = document.getElementById("category").value;
            const date = document.getElementById("date").value;

            const emptyRow = document.getElementById("emptyRow");

            if (emptyRow) {
                emptyRow.remove();
            }

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${expenseName}</td>
                <td>KES ${amount.toFixed(2)}</td>
                <td>${category}</td>
                <td>${date}</td>
                <td>
                    <button class="delete-btn" onclick="deleteExpense(this, ${amount})">
                        Delete
                    </button>
                </td>
            `;

            tableBody.appendChild(row);

            total += amount;
            updateTotal();

            form.reset();
        });

        function deleteExpense(button, amount) {
            button.closest("tr").remove();

            total -= amount;
            updateTotal();

            if (tableBody.children.length === 0) {
                tableBody.innerHTML = `
                    <tr id="emptyRow">
                        <td colspan="5">No expenses added yet.</td>
                    </tr>
                `;
            }
        }

        function updateTotal() {
            totalAmount.textContent = `KES ${total.toFixed(2)}`;
        }
    </script>

</body>
</html>
